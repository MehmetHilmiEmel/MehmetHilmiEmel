name: generate animation

on:
  # Her 24 saatte bir otomatik çalıştır
  schedule:
    - cron: "0 */24 * * *"
  
  # İstediğin zaman manuel olarak da tetikleyebilmek için
  workflow_dispatch:
  
  # Ana şubeye (main/master) her push yapıldığında çalıştır
  push:
    branches:
    - master
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Yılan animasyonunu oluşturur (Kendi kullanıcı adını buraya yaz)
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MehmetHilmiEmel
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # Oluşturulan SVG dosyalarını 'output' adlı yeni bir branch'e (şubeye) yükler
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
